<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f9f7f3" />
    <meta name="description" content="JobProof AI：用一次对话写出每一句都站得住的简历，再用岗位匹配、职业规划和模拟面试把它变成 Offer。" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <title>JobProof AI · 求职证据官</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var prefs = JSON.parse(localStorage.getItem('jp:preferences') || '{}')
          var theme = prefs.theme === 'light' || prefs.theme === 'dark'
            ? prefs.theme
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = theme
          if (prefs.motion === 'reduce' || prefs.motion === 'full') document.documentElement.dataset.motion = prefs.motion
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
