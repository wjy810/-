# 仅本地联调。默认口令不是生产凭据，禁止原样用于正式环境。
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: jobproof
      MYSQL_USER: jobproof
      MYSQL_PASSWORD: jobproof
      MYSQL_ROOT_PASSWORD: jobproof
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ujobproof", "-pjobproof"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  clamav:
    image: clamav/clamav:1.4.6
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: jobproof
      MINIO_ROOT_PASSWORD: jobproof-minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  minio-data:
