name: ${JOBPROOF_DRILL_PROJECT:?isolated project required}
services:
  app:
    image: python:3.11-alpine
    command: ["python", "-c", "import time; time.sleep(3600)"]
    volumes:
      - ./data:/var/lib/jobproof
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: synthetic-drill
      MINIO_ROOT_PASSWORD: synthetic-drill-password-not-a-real-credential
    volumes:
      - objects:/data
volumes:
  objects:
