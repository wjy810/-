# Explicit opt-in: docker compose -f docker-compose.yml -f docker-compose.https.yml ...
# Certificate issuance/bootstrap instructions: docs/https-deployment.md
services:
  app:
    environment:
      JOBPROOF_COOKIE_SECURE: "true"
      JOBPROOF_TRUSTED_PROXIES: 172.31.247.3/32
      JOBPROOF_PUBLIC_ORIGIN: ${JOBPROOF_HTTPS_ORIGIN:?set https public origin}
    networks:
      default: {}
      ingress: {}
  nginx:
    ports:
      - "443:443"
    volumes:
      - ./nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    networks:
      ingress:
        ipv4_address: 172.31.247.3
  certbot:
    image: certbot/certbot:v5.8.0
    profiles: [acme]
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./acme-webroot:/var/www/certbot
      - ./acme-logs:/var/log/letsencrypt
    security_opt:
      - no-new-privileges:true
networks:
  ingress:
    ipam:
      config:
        - subnet: 172.31.247.0/24
